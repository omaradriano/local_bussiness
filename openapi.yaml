openapi: 3.1.0
info:
  title: Local Bussiness API
  version: 0.1.0
  description: Contrato único de la API. De aquí sale el cliente TypeScript (`pnpm gen`).

servers:
  - url: https://api-staging-4e97e.up.railway.app
    description: staging
  - url: http://localhost:8090
    description: local

security:
  - bearer: []

paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /v1/public/businesses/{slug}/privacy:
    get:
      operationId: getPrivacyNotice
      summary: Datos del aviso de privacidad de un negocio (público, sin sesión)
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyNotice" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/me:
    get:
      operationId: getMe
      summary: Usuario de la sesión y sus negocios con rol
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user_id, businesses, platform_admin]
                properties:
                  user_id: { type: string, format: uuid }
                  platform_admin: { type: boolean, description: "Administra la plataforma (no un negocio)" }
                  businesses:
                    type: array
                    items: { $ref: "#/components/schemas/Membership" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/admin/businesses:
    get:
      operationId: adminListBusinesses
      summary: Todos los negocios con su giro y sus funciones (solo administrador de la plataforma)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [businesses]
                properties:
                  businesses: { type: array, items: { $ref: "#/components/schemas/AdminBusiness" } }
        "403": { $ref: "#/components/responses/Error" }

  /v1/admin/businesses/{businessId}/features/{feature}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: feature, in: path, required: true, schema: { $ref: "#/components/schemas/Feature" } }
    put:
      operationId: adminSetFeature
      summary: Da (true) o quita (false) una función a un negocio; null = como su giro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant]
              properties:
                grant: { type: [boolean, "null"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBusiness" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/businesses:
    post:
      operationId: createBusiness
      summary: Registra un negocio con la plantilla de su giro; el usuario queda como dueño
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, vertical]
              properties:
                name: { type: string, maxLength: 80 }
                slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", minLength: 3, maxLength: 60 }
                vertical: { $ref: "#/components/schemas/Vertical" }
                timezone: { type: string, default: America/Chihuahua }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: getBusinessRole
      summary: Rol del usuario en el negocio
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [business_id, role]
                properties:
                  business_id: { type: string, format: uuid }
                  role: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/catalog:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: listCatalog
      summary: Artículos del negocio (cualquier miembro)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogItem" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createCatalogItem
      summary: Crea un artículo (solo dueño)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemInput" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/catalog/{itemId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateCatalogItem
      summary: Edita campos del artículo (solo dueño); el tipo no cambia
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/catalog/{itemId}/units:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: listUnits
      summary: Unidades físicas de una herramienta en renta (cualquier miembro)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [units]
                properties:
                  units:
                    type: array
                    items: { $ref: "#/components/schemas/Unit" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createUnit
      summary: Agrega una unidad (solo dueño); la clave se guarda en mayúsculas
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitPatch" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/catalog/{itemId}/units/{unitId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - $ref: "#/components/parameters/ItemId"
      - name: unitId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateUnit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/staff:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: listStaff
      summary: Equipo con sus servicios y horarios (cualquier miembro)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [staff]
                properties:
                  staff:
                    type: array
                    items: { $ref: "#/components/schemas/StaffMember" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createStaff
      summary: Agrega a una persona (solo dueño)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffPatch" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/staff/{staffId}/:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - $ref: "#/components/parameters/StaffId"
    patch:
      operationId: updateStaff
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/staff/{staffId}/services:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - $ref: "#/components/parameters/StaffId"
    put:
      operationId: setStaffServices
      summary: Reemplaza los servicios que atiende la persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_ids]
              properties:
                service_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "204": { description: Guardado }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/staff/{staffId}/hours:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - $ref: "#/components/parameters/StaffId"
    put:
      operationId: setStaffHours
      summary: Reemplaza el horario de la persona
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoursBody" }
      responses:
        "204": { description: Guardado }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/hours:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: getBusinessHours
      summary: Horario general del negocio
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HoursBody" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: setBusinessHours
      summary: Reemplaza el horario general (solo dueño)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoursBody" }
      responses:
        "204": { description: Guardado }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/catalog/{itemId}/images/:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: createImageUpload
      summary: Registra una foto y devuelve una URL prefirmada para subirla directo a S3 (solo dueño)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, size]
              properties:
                content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
                size: { type: integer, minimum: 1, maximum: 5242880 }
      responses:
        "201":
          description: Subir con PUT a upload_url con estos headers, y luego llamar a complete
          content:
            application/json:
              schema:
                type: object
                required: [image, upload_url, upload_headers]
                properties:
                  image: { $ref: "#/components/schemas/CatalogImage" }
                  upload_url: { type: string }
                  upload_headers: { type: object, additionalProperties: { type: string } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/catalog/{itemId}/images/{imageId}/complete:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - $ref: "#/components/parameters/ItemId"
      - $ref: "#/components/parameters/ImageId"
    post:
      operationId: completeImageUpload
      summary: Confirma la subida y encola la generación de tamaños
      responses:
        "202":
          description: En proceso
          content:
            application/json:
              schema:
                type: object
                required: [image]
                properties:
                  image: { $ref: "#/components/schemas/CatalogImage" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/catalog/{itemId}/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - $ref: "#/components/parameters/ItemId"
      - $ref: "#/components/parameters/ImageId"
    delete:
      operationId: deleteImage
      responses:
        "204": { description: Borrada }
        "404": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/quote:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: quoteBooking
      summary: Precio antes de crear (mismas reglas que al crear, sin opciones ni envío)
      parameters:
        - { name: item_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: quantity, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: starts_at, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: ends_at, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [subtotal, total, deposit_required, security_deposit, periods]
                properties:
                  subtotal: { type: integer }
                  total: { type: integer }
                  deposit_required: { type: integer }
                  security_deposit: { type: integer }
                  periods: { type: integer, description: "Días que se cobran (renta)" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/settings/documents:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: listDocumentTypes
      summary: Documentos adicionales que el negocio pide en cada renta
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents: { type: array, items: { $ref: "#/components/schemas/DocumentType" } }
    post:
      operationId: createDocumentType
      summary: Agrega un documento adicional (solo dueño)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentTypeInput" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentType" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/settings/documents/{docTypeId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: docTypeId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateDocumentType
      summary: Renombra, hace obligatorio o activa/desactiva (solo afecta rentas nuevas)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentTypeInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentType" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/products:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: listProducts
      summary: Productos a la venta (función productSales); el costo solo para el dueño
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products: { type: array, items: { $ref: "#/components/schemas/RetailProduct" } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetailProductInput" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetailProduct" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateProduct
      summary: Nombre, precio, costo o activo (las existencias solo cambian con ventas y compras)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetailProductInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetailProduct" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/products/{productId}/purchases:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: purchaseStock
      summary: Compra de mercancía; suma existencias, actualiza el costo y cuenta como gasto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, unit_cost, purchased_on]
              properties:
                quantity: { type: integer, minimum: 1 }
                unit_cost: { type: integer, minimum: 0 }
                purchased_on: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetailProduct" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/products/stats:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: productStats
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductStats" }

  /v1/b/{businessId}/sales:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: listSales
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sales]
                properties:
                  sales: { type: array, items: { $ref: "#/components/schemas/Sale" } }
    post:
      operationId: sell
      summary: Venta (cualquiera del equipo); descuenta existencias; sola o durante una reserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines, method]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
                method: { type: string, enum: [cash, transfer, card] }
                booking_id: { type: string, format: uuid }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/sales/{saleId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: saleId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: cancelSale
      summary: Cancela una venta (error) y regresa las existencias (solo dueño)
      responses:
        "204": { description: Cancelada }
        "404": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/finances/summary:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: financeSummary
      summary: Ingresos (lo cobrado), gastos (con sueldos, comisiones y mensualidades) y ganancia del periodo (solo dueño)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: "Por defecto, el mes actual" }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceSummary" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/finances/expenses:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: listExpenses
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [expenses]
                properties:
                  expenses: { type: array, items: { $ref: "#/components/schemas/Expense" } }
    post:
      operationId: addExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spent_on, category, amount]
              properties:
                spent_on: { type: string, format: date }
                category: { $ref: "#/components/schemas/ExpenseCategory" }
                amount: { type: integer, minimum: 1 }
                description: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/finances/expenses/{expenseId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: expenseId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteExpense
      responses:
        "204": { description: Borrado }
        "404": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/finances/plans:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: listPlans
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans: { type: array, items: { $ref: "#/components/schemas/ExpensePlan" } }
    post:
      operationId: addPlan
      summary: Compra a plazos; cada mensualidad cuenta como gasto en su fecha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, category, purchased_on, installment_amount, installments, first_due]
              properties:
                description: { type: string, maxLength: 120 }
                category: { $ref: "#/components/schemas/ExpenseCategory" }
                purchased_on: { type: string, format: date }
                down_payment: { type: integer, minimum: 0 }
                installment_amount: { type: integer, minimum: 1 }
                installments: { type: integer, minimum: 1, maximum: 360 }
                first_due: { type: string, format: date }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpensePlan" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/finances/plans/{planId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deletePlan
      responses:
        "204": { description: Borrado }
        "404": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/finances/pay:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: listPay
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [pay]
                properties:
                  pay: { type: array, items: { $ref: "#/components/schemas/StaffPay" } }

  /v1/b/{businessId}/finances/pay/{staffId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: staffId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setPay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [salary, salary_period, commission_percent]
              properties:
                salary: { type: integer, minimum: 0 }
                salary_period: { type: string, enum: [weekly, biweekly, monthly] }
                commission_percent: { type: number, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffPay" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/inventory:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: getInventory
      summary: Unidades de renta con sus rentas activas o por venir, ordenadas por fecha
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [rows]
                properties:
                  rows: { type: array, items: { $ref: "#/components/schemas/InventoryRow" } }

  /v1/b/{businessId}/settings:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: getSettings
      summary: Ajustes del negocio (cualquier miembro)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      operationId: updateSettings
      summary: Cambia ajustes (solo dueño); lo que no se manda se conserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                features:
                  type: object
                  description: "Función -> encendida o apagada (solo las disponibles)"
                  additionalProperties: { type: boolean }
                general:
                  type: object
                  properties:
                    deposit_percent: { type: integer, minimum: 0, maximum: 100 }
                    hold_hours: { type: integer, minimum: 1, maximum: 168 }
                    advance_only_online: { type: boolean }
                agenda:
                  type: object
                  properties:
                    buffer_minutes: { type: integer, minimum: 0, maximum: 240 }
                delivery:
                  type: object
                  properties:
                    delivery_zones: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/DeliveryZone" } }
                privacy:
                  type: object
                  properties:
                    privacy_legal_name: { type: string, maxLength: 120 }
                    privacy_address: { type: string, maxLength: 300 }
                    privacy_email: { type: string, maxLength: 120 }
                rentals:
                  type: object
                  properties:
                    security_deposit_enabled: { type: boolean }
                    late_fee_multiplier: { type: number, minimum: 0, maximum: 10 }
                    rentals_span_closed_days: { type: boolean }
                    charge_closed_days: { type: boolean }
                    inspection_minutes: { type: integer, minimum: 0, maximum: 10080 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/customers:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: searchCustomers
      summary: Busca clientes por nombre o teléfono (vacío = los más recientes)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [customers]
                properties:
                  customers: { type: array, items: { $ref: "#/components/schemas/Customer" } }
    post:
      operationId: createCustomer
      summary: Registra un cliente (renta exige dirección y aval). Teléfono repetido → 409 customer_exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/customers/{customerId}/:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: getCustomer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateCustomer
      summary: Edita la ficha (solo el dueño cambia "de confianza")
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/customers/{customerId}/uploads:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - $ref: "#/components/parameters/CustomerId"
    post:
      operationId: createCustomerUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_type, content_type, size]
              properties:
                doc_type: { $ref: "#/components/schemas/DocType" }
                content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
                size: { type: integer, minimum: 1, maximum: 5242880 }
      responses:
        "201":
          description: Subir con PUT y luego registrar la llave en /documents
          content:
            application/json:
              schema:
                type: object
                required: [key, upload_url, upload_headers]
                properties:
                  key: { type: string }
                  upload_url: { type: string }
                  upload_headers: { type: object, additionalProperties: { type: string } }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/customers/{customerId}/documents:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - $ref: "#/components/parameters/CustomerId"
    post:
      operationId: addCustomerDocuments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_type, keys]
              properties:
                doc_type: { $ref: "#/components/schemas/DocType" }
                keys: { type: array, items: { type: string }, minItems: 1, maxItems: 6 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/customers/{customerId}/documents/{docId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - $ref: "#/components/parameters/CustomerId"
      - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteCustomerDocument
      summary: Borra un documento (solo dueño)
      responses:
        "204": { description: Borrado }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/customers/{customerId}/files:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: getCustomerFile
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: URL de lectura de 5 minutos
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        "404": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/availability:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: getAvailability
      summary: Qué hay libre para un artículo, según su tipo
      description: |
        - Servicio: `date` (AAAA-MM-DD, zona del negocio) y opcional `staff_id` → `slots`.
        - Producto: `from` y opcional `to` (AAAA-MM-DD, máx. 2 meses; por defecto 14 días) y `quantity` → `days`.
        - Renta: `from` y `to` (RFC 3339) y `quantity` → `free_units`.
      parameters:
        - { name: item_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: quantity, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: staff_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/bookings:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: listBookings
      summary: Reservas que se cruzan con [from, to) (máx. 3 meses); activas por defecto
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/ItemKind" } }
        - { name: status, in: query, schema: { type: string, enum: [active, all], default: active } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [bookings]
                properties:
                  bookings:
                    type: array
                    items: { $ref: "#/components/schemas/BookingSummary" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      operationId: createBooking
      summary: Alta de cita, pedido o renta en mostrador (dueño o empleado)
      description: El precio, el anticipo y el estado los calcula el servidor. Un choque responde 409 slot_taken.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Clave única por intento de alta (8–100 caracteres); un reintento devuelve la misma reserva con 200.
          schema: { type: string, minLength: 8, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingInput" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "200":
          description: Ya existía (misma Idempotency-Key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/bookings/history:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: bookingHistory
      summary: Historial, de la más reciente a la más antigua; se pagina con before + before_id de la última fila
      parameters:
        - { name: group, in: query, schema: { type: string, enum: [active, finished, cancelled] } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 }, description: "Cliente (nombre o teléfono) o artículo" }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { name: before_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [bookings]
                properties:
                  bookings: { type: array, items: { $ref: "#/components/schemas/BookingSummary" } }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/bookings/{bookingId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - name: bookingId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getBooking
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/bookings/{bookingId}/transition:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: transitionBooking
      summary: Cambia el estado (dueño o empleado). La máquina y los requisitos se validan en el servidor.
      description: "Errores 422: `validation_failed` (transición inválida, falta anticipo o saldo) o `steps_pending` (details.steps)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: "#/components/schemas/BookingStatus" }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/bookings/{bookingId}/uploads:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createBookingUpload
      summary: URL prefirmada para subir un archivo de un paso (INE, evidencias) a su bucket privado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, size]
              properties:
                step_id: { type: string, format: uuid, description: "Paso al que pertenece (si no es evidencia de pago)" }
                purpose: { type: string, enum: [payment, document], description: "payment = evidencia de un pago; document = documento adicional (foto o PDF)" }
                content_type: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
                size: { type: integer, minimum: 1, maximum: 5242880 }
      responses:
        "201":
          description: Subir con PUT y luego mandar `key` al completar el paso
          content:
            application/json:
              schema:
                type: object
                required: [key, upload_url, upload_headers]
                properties:
                  key: { type: string }
                  upload_url: { type: string }
                  upload_headers: { type: object, additionalProperties: { type: string } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/bookings/{bookingId}/steps/{stepId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: stepId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: completeStep
      summary: Completa un paso; lo valida el tipo de paso registrado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { type: object, additionalProperties: true, description: "text: {text}; number: {value}; checklist: {checked: {item: true}}" }
                files: { type: array, items: { type: string }, maxItems: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/bookings/{bookingId}/files:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBookingFile
      summary: URL de lectura de 5 minutos para un archivo privado de la reserva
      parameters:
        - { name: bucket, in: query, required: true, schema: { type: string, enum: [private-docs, rental-evidence] } }
        - { name: key, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        "404": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/bookings/{bookingId}/checkout:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: checkoutRental
      summary: Salida de la renta (pasos previos hechos y depósito de garantía cobrado)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                condition: { type: string, maxLength: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/bookings/{bookingId}/steps/{stepId}/files:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: stepId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: removeStepFile
      summary: Quita una foto de un paso mientras su momento no haya pasado; sin fotos vuelve a pendiente
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/bookings/{bookingId}/documents:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: addBookingDocument
      summary: Adjunta un documento con el nombre que le den (archivos subidos con purpose=document)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, files]
              properties:
                name: { type: string, maxLength: 60 }
                files: { type: array, minItems: 1, maxItems: 6, items: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/bookings/{bookingId}/documents/{docId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: removeBookingDocument
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/bookings/{bookingId}/extend:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: extendRental
      summary: Extiende una renta (mismas unidades, total recalculado); 409 si una unidad ya está apartada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ends_at]
              properties:
                ends_at: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/bookings/{bookingId}/return:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: returnRental
      summary: Devolución; si es anticipada libera las unidades; el recargo por retraso queda sugerido en `rental`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                condition: { type: string, maxLength: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/bookings/{bookingId}/payments:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: addPayment
      summary: Registra un pago; cubrir el anticipo de un apartado lo confirma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, method, amount]
              properties:
                type: { $ref: "#/components/schemas/PaymentType" }
                method: { type: string, enum: [cash, transfer, card] }
                amount: { type: integer, format: int64, minimum: 1 }
                notes: { type: string, maxLength: 500 }
                evidence:
                  type: array
                  maxItems: 4
                  description: "Llaves de fotos subidas con purpose=payment (transferencia o ticket)"
                  items: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Access token de Supabase Auth

  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImageId:
      name: imageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StaffId:
      name: staffId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BusinessId:
      name: businessId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: Error con formato único
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: {}

    Role:
      type: string
      enum: [owner, staff]

    Vertical:
      type: string
      enum: [nails, flowers, tool_rental, barbershop]

    ItemKind:
      type: string
      enum: [service, product, rental]

    PriceUnit:
      type: string
      enum: [day, weekend, week]

    CatalogItemFields:
      type: object
      description: Montos en centavos MXN. Cada tipo usa solo sus campos.
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string }
        price: { type: integer, format: int64, minimum: 0 }
        duration_minutes: { type: [integer, "null"], description: "servicio" }
        buffer_minutes: { type: integer, description: "servicio" }
        prep_hours: { type: [integer, "null"], description: "producto" }
        daily_capacity: { type: [integer, "null"], description: "producto" }
        price_unit: { oneOf: [{ $ref: "#/components/schemas/PriceUnit" }, { type: "null" }], description: "renta" }
        security_deposit: { type: [integer, "null"], format: int64, description: "renta" }
        late_fee_per_day: { type: [integer, "null"], format: int64, description: "renta" }

    CatalogItemInput:
      allOf:
        - $ref: "#/components/schemas/CatalogItemFields"
        - type: object
          required: [kind, name, price]
          properties:
            kind: { $ref: "#/components/schemas/ItemKind" }
            units: { type: integer, minimum: 0, maximum: 50, description: "Renta: piezas a crear de inmediato (claves tipo ROT-01)" }

    CatalogItemPatch:
      allOf:
        - $ref: "#/components/schemas/CatalogItemFields"
        - type: object
          properties:
            active: { type: boolean }
            sort: { type: integer }

    CatalogItem:
      allOf:
        - $ref: "#/components/schemas/CatalogItemFields"
        - type: object
          required: [id, kind, name, description, price, active, sort, buffer_minutes]
          properties:
            id: { type: string, format: uuid }
            kind: { $ref: "#/components/schemas/ItemKind" }
            name: { type: string }
            description: { type: string }
            price: { type: integer, format: int64 }
            buffer_minutes: { type: integer }
            active: { type: boolean }
            sort: { type: integer }
            images:
              type: array
              items: { $ref: "#/components/schemas/CatalogImage" }

    CatalogImage:
      type: object
      required: [id, item_id, status, width, height, blurhash, urls]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        status: { type: string, enum: [processing, ready, failed] }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
        blurhash: { type: [string, "null"] }
        urls:
          type: [object, "null"]
          description: "Variante (thumb 160 px, card 480 px, detail 1080 px) -> URL del CDN"
          additionalProperties: { type: string }

    InventoryRow:
      type: object
      required: [state, date, unit_id, unit_code, unit_status, item_id, item_name, booking_id, booking_status, customer_name, starts_at, ends_at]
      properties:
        state: { type: string, enum: [available, rented, scheduled, inactive] }
        date: { type: [string, "null"], format: date-time, description: "rentada: regreso; agendada: salida" }
        unit_id: { type: string, format: uuid }
        unit_code: { type: string }
        unit_status: { $ref: "#/components/schemas/UnitStatus" }
        item_id: { type: string, format: uuid }
        item_name: { type: string }
        booking_id: { type: [string, "null"], format: uuid }
        booking_status: { type: [string, "null"] }
        customer_name: { type: [string, "null"] }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }

    DocumentType:
      type: object
      required: [id, name, required, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        required: { type: boolean, description: "La salida espera este documento" }
        active: { type: boolean }

    DocumentTypeInput:
      type: object
      properties:
        name: { type: string, maxLength: 60 }
        required: { type: boolean }
        active: { type: boolean }

    DocType:
      type: string
      enum: [ine, proof_of_address, guarantor_id]

    CustomerInput:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        phone: { type: string, description: "E.164 (+526141234567)" }
        email: { type: string }
        address: { type: string, maxLength: 300 }
        guarantor_name: { type: string, maxLength: 80 }
        guarantor_phone: { type: string }
        trusted: { type: boolean }
        notes: { type: string }
        privacy_accepted: { type: boolean, description: "true registra que aceptó el aviso vigente; false no borra lo registrado" }

    Customer:
      type: object
      required: [id, name, phone, email, address, guarantor_name, guarantor_phone, trusted, notes, privacy_accepted_at, privacy_version, documents, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        email: { type: [string, "null"] }
        address: { type: [string, "null"] }
        guarantor_name: { type: [string, "null"] }
        guarantor_phone: { type: [string, "null"] }
        trusted: { type: boolean, description: "No se le exigen documentos" }
        notes: { type: [string, "null"] }
        privacy_accepted_at: { type: [string, "null"], format: date-time, description: "Cuándo aceptó el aviso de privacidad del negocio" }
        privacy_version: { type: [string, "null"], description: "Versión del aviso que aceptó" }
        created_at: { type: string, format: date-time }
        documents:
          type: array
          items:
            type: object
            required: [id, doc_type, key, created_at]
            properties:
              id: { type: string, format: uuid }
              doc_type: { $ref: "#/components/schemas/DocType" }
              key: { type: string }
              created_at: { type: string, format: date-time }

    PrivacyNotice:
      type: object
      required: [name, legal_name, address, email, phone, version]
      properties:
        name: { type: string }
        legal_name: { type: string, description: "Responsable; el nombre del negocio si no se capturó" }
        address: { type: string }
        email: { type: string }
        phone: { type: string, description: "WhatsApp del negocio (E.164) o vacío" }
        version: { type: string, description: "Versión vigente del aviso (AAAA-MM-DD)" }

    RetailProduct:
      type: object
      required: [id, name, price, cost, stock, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        price: { type: integer }
        cost: { type: [integer, "null"], description: "Solo para el dueño" }
        stock: { type: integer }
        active: { type: boolean }

    RetailProductInput:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        price: { type: integer, minimum: 0 }
        cost: { type: integer, minimum: 0 }
        stock: { type: integer, minimum: 0, description: "Solo al crear" }
        active: { type: boolean }

    Sale:
      type: object
      required: [id, booking_id, sold_at, method, total, lines]
      properties:
        id: { type: string, format: uuid }
        booking_id: { type: [string, "null"] }
        sold_at: { type: string, format: date-time }
        method: { type: string, enum: [cash, transfer, card] }
        total: { type: integer }
        lines:
          type: array
          items:
            type: object
            required: [product_id, name, quantity, unit_price]
            properties:
              product_id: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
              unit_price: { type: integer }

    ProductStats:
      type: object
      required: [revenue, cost, profit, purchases, units, sales, by_product, low_stock, stock_value]
      properties:
        revenue: { type: integer }
        cost: { type: integer, description: "Costo de lo vendido" }
        profit: { type: integer }
        purchases: { type: integer, description: "Mercancía comprada en el periodo" }
        units: { type: integer }
        sales: { type: integer }
        stock_value: { type: integer, description: "Lo que costó la mercancía en existencia" }
        low_stock: { type: array, items: { $ref: "#/components/schemas/RetailProduct" } }
        by_product:
          type: array
          items:
            type: object
            required: [product_id, name, units, revenue, cost, profit]
            properties:
              product_id: { type: string, format: uuid }
              name: { type: string }
              units: { type: integer }
              revenue: { type: integer }
              cost: { type: integer }
              profit: { type: integer }

    ExpenseCategory:
      type: string
      enum: [transport, maintenance, rent, utilities, supplies, asset, advertising, taxes, payroll, other]

    Expense:
      type: object
      required: [id, spent_on, category, amount, description, created_at]
      properties:
        id: { type: string, format: uuid }
        spent_on: { type: string, description: "Fecha (medianoche UTC); usar los primeros 10 caracteres" }
        category: { $ref: "#/components/schemas/ExpenseCategory" }
        amount: { type: integer }
        description: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    ExpensePlan:
      type: object
      required: [id, description, category, purchased_on, down_payment, installment_amount, installments, first_due]
      properties:
        id: { type: string, format: uuid }
        description: { type: string }
        category: { $ref: "#/components/schemas/ExpenseCategory" }
        purchased_on: { type: string }
        down_payment: { type: integer }
        installment_amount: { type: integer }
        installments: { type: integer }
        first_due: { type: string }

    StaffPay:
      type: object
      required: [staff_id, name, active, salary, salary_period, commission_percent]
      properties:
        staff_id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        salary: { type: integer }
        salary_period: { type: string, enum: [weekly, biweekly, monthly] }
        commission_percent: { type: number }

    FinancePart:
      type: object
      required: [key, amount]
      properties:
        key: { type: string, description: "Ingresos: bookings | fees | products. Gastos: una categoría, payroll o commissions" }
        amount: { type: integer }

    FinanceSide:
      type: object
      required: [total, parts]
      properties:
        total: { type: integer }
        parts: { type: array, items: { $ref: "#/components/schemas/FinancePart" } }

    FinanceSummary:
      type: object
      required: [from, to, income, expenses, profit, plans, payroll, bookings, overdue]
      properties:
        from: { type: string }
        to: { type: string }
        bookings:
          type: array
          description: "Reservas que empiezan en el periodo, por estado (en orden del ciclo de vida, sin ceros)"
          items:
            type: object
            required: [key, count]
            properties:
              key: { $ref: "#/components/schemas/BookingStatus" }
              count: { type: integer }
        overdue:
          type: array
          description: "Rentas vencidas ahora mismo (sin importar el periodo), la más atrasada primero"
          items:
            type: object
            required: [booking_id, customer, item, due, days_late]
            properties:
              booking_id: { type: string, format: uuid }
              customer: { type: string }
              item: { type: string }
              due: { type: string, format: date-time }
              days_late: { type: integer, description: "Días de atraso, contando el día empezado (mínimo 1)" }
        income: { $ref: "#/components/schemas/FinanceSide" }
        expenses: { $ref: "#/components/schemas/FinanceSide" }
        profit: { type: integer }
        plans:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/ExpensePlan"
              - type: object
                required: [paid, remaining, next_due, in_period, status]
                properties:
                  paid: { type: integer }
                  remaining: { type: integer }
                  next_due: { type: [string, "null"] }
                  in_period: { type: integer }
                  status: { type: string, enum: [active, finished] }
        payroll:
          type: array
          items:
            type: object
            required: [staff_id, name, salary, commission]
            properties:
              staff_id: { type: string, format: uuid }
              name: { type: string }
              salary: { type: integer }
              commission: { type: integer }

    Feature:
      type: string
      enum: [staff, inventory, guarantor, customerAddress, customerDocuments, trustedCustomers, walkIn, homeService, startService, bookingDocuments, productSales]

    FeatureState:
      type: object
      required: [key, from_giro, grant, available, enabled, active]
      properties:
        key: { $ref: "#/components/schemas/Feature" }
        from_giro: { type: boolean, description: "La trae su giro" }
        grant: { type: [boolean, "null"], description: "Excepción del administrador: true = dada, false = quitada, null = como el giro" }
        available: { type: boolean, description: "El dueño la puede usar" }
        enabled: { type: boolean, description: "El dueño la tiene encendida" }
        active: { type: boolean }

    AdminBusiness:
      type: object
      required: [business_id, slug, name, vertical, created_at, features]
      properties:
        business_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        vertical: { $ref: "#/components/schemas/Vertical" }
        created_at: { type: string, format: date-time }
        features: { type: array, items: { $ref: "#/components/schemas/FeatureState" } }

    DeliveryZone:
      type: object
      required: [name, fee]
      properties:
        name: { type: string, maxLength: 40 }
        fee: { type: integer, description: centavos }

    Settings:
      type: object
      required: [general, agenda, rentals, delivery, privacy, features]
      description: "Todas las secciones; la app muestra las que le tocan al giro del negocio"
      properties:
        features: { type: array, items: { $ref: "#/components/schemas/FeatureState" }, description: "Funciones que admite su giro; el dueño solo cambia enabled" }
        general:
          type: object
          required: [deposit_percent, hold_hours, advance_only_online]
          properties:
            deposit_percent: { type: integer, description: "Anticipo al apartar, % del total (0 = sin anticipo)" }
            hold_hours: { type: integer, description: "Horas que espera un apartado sin anticipo" }
            advance_only_online: { type: boolean, description: "El anticipo solo se pide en reservas por internet; las del mostrador quedan confirmadas" }
        agenda:
          type: object
          required: [buffer_minutes]
          properties:
            buffer_minutes: { type: integer, description: "Margen después de cada cita, para todo el negocio" }
        delivery:
          type: object
          required: [delivery_zones]
          properties:
            delivery_zones: { type: array, items: { $ref: "#/components/schemas/DeliveryZone" } }
        privacy:
          type: object
          description: "Responsable de los datos en el aviso de privacidad del negocio; vacío = nombre del negocio y su WhatsApp"
          required: [privacy_legal_name, privacy_address, privacy_email]
          properties:
            privacy_legal_name: { type: string }
            privacy_address: { type: string }
            privacy_email: { type: string }
        rentals:
          type: object
          required: [security_deposit_enabled, late_fee_multiplier, rentals_span_closed_days, charge_closed_days, inspection_minutes]
          properties:
            security_deposit_enabled: { type: boolean, description: "Pedir depósito de garantía reembolsable" }
            late_fee_multiplier: { type: number, description: "Un día atrasado cuesta el precio por día × esto" }
            rentals_span_closed_days: { type: boolean, description: "Una renta puede incluir días cerrados" }
            charge_closed_days: { type: boolean, description: "Esos días cerrados se cobran" }
            inspection_minutes: { type: integer, description: "Revisión entre rentas de una unidad (0 = sin revisión; la app la captura en horas)" }

    Availability:
      type: object
      required: [kind, available]
      properties:
        kind: { $ref: "#/components/schemas/ItemKind" }
        available: { type: boolean }
        slots:
          type: array
          items:
            type: object
            required: [starts_at, ends_at, staff_ids]
            properties:
              starts_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time }
              staff_ids: { type: array, items: { type: string, format: uuid } }
        days:
          type: array
          items:
            type: object
            required: [date, available, remaining]
            properties:
              date: { type: string, format: date }
              available: { type: boolean }
              remaining: { type: integer, description: "-1 = sin límite" }
              closed: { type: boolean, description: "Renta: el negocio cierra (no se sale ni regresa), pero una renta puede abarcarlo" }
        free_units: { type: array, items: { type: string, format: uuid } }

    PaymentType:
      type: string
      enum: [advance, balance, security_deposit, refund, late_fee, damage_fee]

    BookingStatus:
      type: string
      enum: [pending_deposit, confirmed, in_progress, ready, out_for_delivery, checked_out, overdue, returned, completed, cancelled, expired, no_show]

    BookingInput:
      type: object
      required: [customer, item_id, starts_at]
      properties:
        customer:
          type: object
          description: "`id` de un cliente existente, `name` + `phone` (10 dígitos de México o E.164), o `walk_in` (cliente casual, si el negocio tiene esa función)"
          properties:
            walk_in: { type: boolean }
            id: { type: string, format: uuid }
            name: { type: string }
            phone: { type: string }
            email: { type: string }
            privacy_accepted: { type: boolean, description: "El cliente aceptó el aviso de privacidad del negocio" }
        initial_payment:
          type: object
          description: "Lo que el cliente paga al crearla (solo mostrador). Sin `amount` = el total."
          required: [method]
          properties:
            method: { type: string, enum: [cash, transfer, card] }
            amount: { type: integer, minimum: 1, description: centavos }
        item_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 100, default: 1 }
        starts_at: { type: string, format: date-time, description: "Servicio: hora de la cita; producto: entrega; renta: salida" }
        ends_at: { type: string, format: date-time, description: "Renta: regreso" }
        staff_id: { type: string, format: uuid, description: "Servicio: persona preferida" }
        fulfillment: { type: string, enum: [pickup, delivery] }
        delivery_address: { type: string }
        delivery_zone: { type: string }
        options: { type: object, additionalProperties: { type: string } }
        notes: { type: string, maxLength: 1000 }

    Booking:
      type: object
      required: [id, kind, status, starts_at, ends_at, customer, items, staff, units, subtotal, deposit_required, total, source, hold_expires_at, public_token, created_at, payments, balance, events, steps, next, rental, documents]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ItemKind" }
        status: { $ref: "#/components/schemas/BookingStatus" }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        customer:
          type: object
          required: [id, name, phone, walk_in]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            phone: { type: string }
            walk_in: { type: boolean, description: "Cliente casual del negocio (sin ficha ni WhatsApp)" }
        items:
          type: array
          items:
            type: object
            required: [item_id, name, quantity, unit_price, options]
            properties:
              item_id: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
              unit_price: { type: integer, format: int64 }
              options: { type: object, additionalProperties: true }
        staff:
          type: array
          items: { $ref: "#/components/schemas/Ref" }
        units:
          type: array
          items: { $ref: "#/components/schemas/Ref" }
        fulfillment: { type: [string, "null"] }
        delivery_address: { type: [string, "null"] }
        subtotal: { type: integer, format: int64 }
        deposit_required: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        notes: { type: [string, "null"] }
        source: { type: string, enum: [public, admin] }
        hold_expires_at: { type: [string, "null"], format: date-time }
        public_token: { type: string }
        created_at: { type: string, format: date-time }
        documents:
          type: array
          description: "Documentos adjuntos con nombre libre"
          items:
            type: object
            required: [id, name, files, created_at]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              files: { type: array, items: { type: string } }
              created_at: { type: string, format: date-time }
        payments:
          type: array
          items:
            type: object
            required: [id, type, method, amount, paid_at, recorded_by, notes, evidence]
            properties:
              id: { type: string, format: uuid }
              type: { $ref: "#/components/schemas/PaymentType" }
              method: { type: string, enum: [cash, transfer, card] }
              amount: { type: integer, format: int64 }
              paid_at: { type: string, format: date-time }
              recorded_by: { type: [string, "null"] }
              notes: { type: [string, "null"] }
              evidence: { type: array, items: { type: string }, description: "Fotos del comprobante (private-docs)" }
        balance:
          type: object
          required: [paid, due, deposit_held, extra_charges]
          properties:
            paid: { type: integer, format: int64 }
            due: { type: integer, format: int64 }
            deposit_held: { type: integer, format: int64 }
            extra_charges: { type: integer, format: int64 }
        events:
          type: array
          items:
            type: object
            required: [from_status, to_status, at, note]
            properties:
              from_status: { type: [string, "null"] }
              to_status: { type: string }
              at: { type: string, format: date-time }
              note: { type: [string, "null"] }
        steps:
          type: array
          items:
            type: object
            required: [id, label, step_type, to_status, required, status, completed_at, files, config, bucket, customer_doc, on_file]
            properties:
              id: { type: string, format: uuid }
              label: { type: string }
              step_type: { type: string }
              to_status: { type: [string, "null"] }
              required: { type: boolean }
              status: { type: string, enum: [pending, done, skipped] }
              completed_at: { type: [string, "null"], format: date-time }
              files: { type: array, items: { type: string } }
              config: { type: object, additionalProperties: true }
              bucket: { type: string, description: "Bucket privado de sus archivos (vacío si no lleva archivos)" }
              customer_doc: { type: string, description: "Documento de la ficha del cliente que cumple este paso (ine, proof_of_address) o vacío" }
              on_file: { type: boolean, description: "Ese documento ya está en la ficha (o el cliente es de confianza)" }
        next:
          type: array
          items: { $ref: "#/components/schemas/BookingStatus" }
        rental:
          oneOf:
            - type: "null"
            - type: object
              required: [checked_out_at, returned_at, out_condition, return_condition, late_days, late_fee_suggested]
              properties:
                checked_out_at: { type: [string, "null"], format: date-time }
                returned_at: { type: [string, "null"], format: date-time }
                out_condition: { type: [string, "null"] }
                return_condition: { type: [string, "null"] }
                late_days: { type: integer }
                late_fee_suggested: { type: integer, format: int64 }

    BookingSummary:
      type: object
      required: [id, kind, status, starts_at, ends_at, customer_name, customer_phone, items, units, staff, total, deposit_required]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ItemKind" }
        status: { $ref: "#/components/schemas/BookingStatus" }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        customer_name: { type: string }
        customer_phone: { type: string }
        items: { type: string }
        units: { type: array, items: { type: string } }
        staff: { type: array, items: { type: string } }
        total: { type: integer, format: int64 }
        deposit_required: { type: integer, format: int64 }

    Ref:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    UnitStatus:
      type: string
      enum: [available, maintenance, retired]

    Unit:
      type: object
      required: [id, item_id, code, status, notes]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        code: { type: string }
        status: { $ref: "#/components/schemas/UnitStatus" }
        notes: { type: string }

    UnitPatch:
      type: object
      properties:
        code: { type: string, maxLength: 40 }
        status: { $ref: "#/components/schemas/UnitStatus" }
        notes: { type: string }

    Hours:
      type: object
      description: Un turno; weekday 0 = domingo; horas HH:MM en la zona del negocio
      required: [weekday, opens_at, closes_at]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6 }
        opens_at: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        closes_at: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }

    HoursBody:
      type: object
      required: [hours]
      properties:
        hours:
          type: array
          items: { $ref: "#/components/schemas/Hours" }

    StaffMember:
      type: object
      required: [id, name, active, color, is_owner, service_ids, hours]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        color: { type: string }
        is_owner: { type: boolean, description: "Ligada a la cuenta del dueño (negocio de una persona)" }
        service_ids: { type: array, items: { type: string, format: uuid } }
        hours:
          type: array
          items: { $ref: "#/components/schemas/Hours" }

    StaffPatch:
      type: object
      properties:
        name: { type: string, maxLength: 60 }
        active: { type: boolean }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }

    Membership:
      type: object
      required: [business_id, slug, name, vertical, role, features]
      properties:
        business_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        vertical: { $ref: "#/components/schemas/Vertical" }
        role: { $ref: "#/components/schemas/Role" }
        features: { type: array, items: { $ref: "#/components/schemas/Feature" }, description: "Funciones activas (disponibles y encendidas)" }
