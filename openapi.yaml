openapi: 3.1.0
info:
  title: Local Bussiness API
  version: 0.1.0
  description: Contrato único de la API. De aquí sale el cliente TypeScript (`pnpm gen`).

servers:
  - url: https://api-staging-4e97e.up.railway.app
    description: staging
  - url: http://localhost:8090
    description: local

security:
  - bearer: []

paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /v1/me:
    get:
      operationId: getMe
      summary: Usuario de la sesión y sus negocios con rol
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user_id, businesses]
                properties:
                  user_id: { type: string, format: uuid }
                  businesses:
                    type: array
                    items: { $ref: "#/components/schemas/Membership" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/businesses:
    post:
      operationId: createBusiness
      summary: Registra un negocio con la plantilla de su giro; el usuario queda como dueño
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, vertical]
              properties:
                name: { type: string, maxLength: 80 }
                slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", minLength: 3, maxLength: 60 }
                vertical: { $ref: "#/components/schemas/Vertical" }
                timezone: { type: string, default: America/Chihuahua }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: getBusinessRole
      summary: Rol del usuario en el negocio
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [business_id, role]
                properties:
                  business_id: { type: string, format: uuid }
                  role: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/catalog:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: listCatalog
      summary: Artículos del negocio (cualquier miembro)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogItem" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createCatalogItem
      summary: Crea un artículo (solo dueño)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemInput" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/b/{businessId}/catalog/{itemId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateCatalogItem
      summary: Edita campos del artículo (solo dueño); el tipo no cambia
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Access token de Supabase Auth

  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: Error con formato único
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: {}

    Role:
      type: string
      enum: [owner, staff]

    Vertical:
      type: string
      enum: [nails, flowers, tool_rental]

    ItemKind:
      type: string
      enum: [service, product, rental]

    PriceUnit:
      type: string
      enum: [day, weekend, week]

    CatalogItemFields:
      type: object
      description: Montos en centavos MXN. Cada tipo usa solo sus campos.
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string }
        price: { type: integer, format: int64, minimum: 0 }
        duration_minutes: { type: [integer, "null"], description: "servicio" }
        buffer_minutes: { type: integer, description: "servicio" }
        prep_hours: { type: [integer, "null"], description: "producto" }
        daily_capacity: { type: [integer, "null"], description: "producto" }
        price_unit: { oneOf: [{ $ref: "#/components/schemas/PriceUnit" }, { type: "null" }], description: "renta" }
        security_deposit: { type: [integer, "null"], format: int64, description: "renta" }
        late_fee_per_day: { type: [integer, "null"], format: int64, description: "renta" }

    CatalogItemInput:
      allOf:
        - $ref: "#/components/schemas/CatalogItemFields"
        - type: object
          required: [kind, name, price]
          properties:
            kind: { $ref: "#/components/schemas/ItemKind" }

    CatalogItemPatch:
      allOf:
        - $ref: "#/components/schemas/CatalogItemFields"
        - type: object
          properties:
            active: { type: boolean }
            sort: { type: integer }

    CatalogItem:
      allOf:
        - $ref: "#/components/schemas/CatalogItemFields"
        - type: object
          required: [id, kind, name, description, price, active, sort, buffer_minutes]
          properties:
            id: { type: string, format: uuid }
            kind: { $ref: "#/components/schemas/ItemKind" }
            name: { type: string }
            description: { type: string }
            price: { type: integer, format: int64 }
            buffer_minutes: { type: integer }
            active: { type: boolean }
            sort: { type: integer }

    Membership:
      type: object
      required: [business_id, slug, name, vertical, role]
      properties:
        business_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        vertical: { $ref: "#/components/schemas/Vertical" }
        role: { $ref: "#/components/schemas/Role" }
