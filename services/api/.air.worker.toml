# Dev hot reload for the worker (go tool air -c .air.worker.toml). Rebuilds and restarts on Go/JSON changes.
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -tags nodynamic -o ./tmp/worker ./cmd/worker"
entrypoint = ["./tmp/worker"]
include_ext = ["go", "json"]
exclude_dir = ["tmp", "bin"]
exclude_regex = ["_test\\.go$"]
delay = 500
# The worker waits up to 20 s for running jobs on stop; a shorter delay left old workers alive,
# each holding its database connections (the staging pooler allows 15 in total).
kill_delay = "25s"
send_interrupt = true

[log]
main_only = true

[misc]
clean_on_exit = true
