name: deploy-production

# Only by hand (Actions → deploy-production → Run workflow), from main, and every job waits for the
# owner's approval in the GitHub "production" environment (required reviewers). No seed: the demo
# businesses are for staging only.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

# Order: migrations -> api + worker -> web, so the new web never talks to an old API.
jobs:
  migrations:
    name: supabase migrations
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - run: supabase db push

  api:
    name: railway api + worker
    needs: migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }} # project token of the production environment
    steps:
      - uses: actions/checkout@v7
      - run: npm i -g @railway/cli@5.49.6
      # Railway's builder sometimes fails before building (no logs); one retry covers it.
      - run: |
          for service in api worker; do
            railway up services/api --path-as-root --service "$service" --ci \
              || { echo "retrying $service"; sleep 20; railway up services/api --path-as-root --service "$service" --ci; } || exit 1
          done
      - name: healthcheck
        run: |
          for i in $(seq 1 20); do
            curl -fsS "${{ vars.API_URL }}/healthz" && exit 0
            sleep 6
          done
          exit 1

  web:
    name: vercel web
    needs: api
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }} # the production Vercel project
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: npm i -g vercel@65.3.1
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
