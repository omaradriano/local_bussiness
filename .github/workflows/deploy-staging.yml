name: deploy-staging

on:
  push:
    branches: [main]
    # Only redeploy when something that ships changes (docs-only merges skip it).
    paths:
      - services/api/**
      - apps/client/**
      - packages/**
      - supabase/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/deploy-staging.yml
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

# Order: migrations -> api + worker -> web, so the new web never talks to an old API.
jobs:
  migrations:
    name: supabase migrations
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - run: supabase db push --include-seed

  api:
    name: railway api + worker
    needs: migrations
    runs-on: ubuntu-latest
    environment: staging
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Client-only merges don't rebuild the API (each Railway build is slow and sometimes flaky).
      - id: changed
        run: |
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "${{ github.event.before }}" 2>/dev/null \
             || ! git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- services/api; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.api == 'true'
        run: npm i -g @railway/cli@5.49.6
      # Railway's builder sometimes fails before building (no logs); one retry covers it.
      - if: steps.changed.outputs.api == 'true'
        run: |
          for service in api worker; do
            railway up services/api --path-as-root --service "$service" --ci \
              || { echo "retrying $service"; sleep 20; railway up services/api --path-as-root --service "$service" --ci; } || exit 1
          done
      - name: healthcheck
        run: |
          for i in $(seq 1 20); do
            curl -fsS "${{ vars.API_URL }}/healthz" && exit 0
            sleep 6
          done
          exit 1

  web:
    name: vercel web
    needs: api
    runs-on: ubuntu-latest
    environment: staging
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: npm i -g vercel@65.3.1
      # The staging Vercel project's "production" target is the staging site.
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
